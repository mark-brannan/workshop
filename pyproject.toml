[project]
name = "workshop"
version = "0.1.0"
description = "Code-first CAD toolchain proof (build123d, headless)"
readme = "README.md"
authors = [
    { name = "Solace (Mark) Brannan", email = "markbrannan@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.13.0",
    "ezdxf>=1.4.5",
    "ocp-vscode>=4.2.0",
    "pytest>=9.2.0",
    "pyvista>=0.49.2",
    "shapely>=2.2.0",
    "trimesh>=5.2.0",
]

[project.scripts]
shop = "shop.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shop"

[tool.pytest.ini_options]
testpaths = ["projects", "tests"]
addopts = "--import-mode=importlib"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
