# Cost per push, measured locally on 2026-11-03: 54 s cold uv install, 14 s tests.
# Budget about 2 minutes per push on a cold cache. One concurrent job, no matrix.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # VTK renders off-screen through a virtual X server; the runner has no
      # EGL or OSMesa, and without a display the render segfaults.
      - run: sudo apt-get install -y -q xvfb libgl1 libxrender1
      - run: xvfb-run -a uv run pytest -q
      # shop.build runs every model.py and model.scad; .scad is skipped (not
      # failed) where openscad.exe is absent, which is every runner for now.
      - name: Build every model
        run: xvfb-run -a uv run python -m shop.build
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: projects/*/out/**
          if-no-files-found: error
