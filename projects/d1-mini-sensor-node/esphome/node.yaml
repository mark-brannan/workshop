# D1 mini sensor node: LD2410C + SCD41 + BME688 + VEML7700 + OLED.
# Wiring and the optional MOX add-on: ../README.md. Secrets: copy secrets.example.yaml to secrets.yaml.
esphome:
  name: d1-sensor-node

esp8266:
  board: d1_mini

logger:
  hardware_uart: UART1   # GPIO2 (D4), TX only; UART0 belongs to the radar

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# LD2410C: 256000 baud is too fast for software serial, so UART0 on the swapped pins.
uart:
  id: radar_uart
  tx_pin: GPIO15   # D8 -> radar RX
  rx_pin: GPIO13   # D7 <- radar TX
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: radar_uart

i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1
  scan: true

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presence
      id: presence
      on_release:
        - delay: 5min
        - lambda: id(oled).turn_off();
      on_press:
        - lambda: id(oled).turn_on();
    has_moving_target:
      name: Moving
    has_still_target:
      name: Still

sensor:
  - platform: ld2410
    moving_distance:
      name: Moving distance
    still_distance:
      name: Still distance
    detection_distance:
      name: Detection distance

  - platform: scd4x            # 0x62
    co2:
      name: CO2
      id: co2_sensor
    temperature:
      name: SCD41 temperature
    humidity:
      name: SCD41 humidity
    ambient_pressure_compensation_source: bme_pressure

  - platform: bme680           # BME688, 0x77; the MOX reference
    address: 0x77
    temperature:
      name: BME688 temperature
    humidity:
      name: BME688 humidity
    pressure:
      name: Pressure
      id: bme_pressure
    gas_resistance:
      name: Gas resistance

  - platform: veml7700         # 0x10. Spare: BH1750 at 0x23 does the same job.
    ambient_light:
      name: Illuminance

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 14

display:
  - platform: ssd1306_i2c      # for an SH1106, use model: "SH1106 128x64"
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.printf(0, 0, id(roboto), "CO2 %.0f ppm", id(co2_sensor).state);
      it.printf(0, 20, id(roboto), "%s", id(presence).state ? "present" : "empty");
