# Desk presence sensor, bench milestone: TM1637 sitting timer while the LD2410C sees you.
# Pins are the README's Wiring table. Secrets: copy secrets.example.yaml to secrets.yaml.
esphome:
  name: desk-presence

esp8266:
  board: d1_mini

logger:
  hardware_uart: UART1   # GPIO2 (D4), TX only; UART0 belongs to the radar

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# LD2410C: 256000 baud is too fast for software serial, so UART0 on the swapped pins.
uart:
  id: radar_uart
  tx_pin: GPIO15   # D8 -> radar RX
  rx_pin: GPIO13   # D7 <- radar TX
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: radar_uart

i2c:
  sda: GPIO4   # D2
  scl: GPIO5   # D1
  scan: true

globals:
  - id: sit_s        # seconds sat, this sitting
    type: int
    initial_value: "0"
  - id: away_s       # seconds away since you left
    type: int
    initial_value: "0"

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presence
      id: presence
    has_moving_target:
      name: Moving target
    has_still_target:
      name: Still target

# Sensitivity tuning, live from Home Assistant or the ESPHome web page: gate 0 is nearest
# (0.75 m per gate). Lower a gate's threshold for more sensitivity, raise it to ignore.
number:
  - platform: ld2410
    timeout:
      name: Radar timeout
    max_move_distance_gate:
      name: Max move gate
    max_still_distance_gate:
      name: Max still gate
    g0:
      move_threshold: {name: g0 move threshold}
      still_threshold: {name: g0 still threshold}
    g1:
      move_threshold: {name: g1 move threshold}
      still_threshold: {name: g1 still threshold}
    g2:
      move_threshold: {name: g2 move threshold}
      still_threshold: {name: g2 still threshold}
    g3:
      move_threshold: {name: g3 move threshold}
      still_threshold: {name: g3 still threshold}
    g4:
      move_threshold: {name: g4 move threshold}
      still_threshold: {name: g4 still threshold}
    g5:
      move_threshold: {name: g5 move threshold}
      still_threshold: {name: g5 still threshold}
    g6:
      move_threshold: {name: g6 move threshold}
      still_threshold: {name: g6 still threshold}
    g7:
      move_threshold: {name: g7 move threshold}
      still_threshold: {name: g7 still threshold}
    g8:
      move_threshold: {name: g8 move threshold}
      still_threshold: {name: g8 still threshold}

switch:
  - platform: ld2410
    engineering_mode:
      name: Radar engineering mode   # on: per-gate energy sensors below report

button:
  - platform: ld2410
    query_params:
      name: Radar query params

sensor:
  - platform: ld2410
    detection_distance:
      name: Detection distance
      id: distance        # cm
    moving_distance:
      name: Moving distance
      id: mdist
    still_distance:
      name: Still distance
      id: sdist
    moving_energy:
      name: Moving energy
      id: menergy
    still_energy:
      name: Still energy
      id: senergy
    g0: {move_energy: {name: g0 move energy}, still_energy: {name: g0 still energy}}
    g1: {move_energy: {name: g1 move energy}, still_energy: {name: g1 still energy}}
    g2: {move_energy: {name: g2 move energy}, still_energy: {name: g2 still energy}}
    g3: {move_energy: {name: g3 move energy}, still_energy: {name: g3 still energy}}
    g4: {move_energy: {name: g4 move energy}, still_energy: {name: g4 still energy}}
    g5: {move_energy: {name: g5 move energy}, still_energy: {name: g5 still energy}}
    g6: {move_energy: {name: g6 move energy}, still_energy: {name: g6 still energy}}
    g7: {move_energy: {name: g7 move energy}, still_energy: {name: g7 still energy}}
    g8: {move_energy: {name: g8 move energy}, still_energy: {name: g8 still energy}}
  # Sitting telemetry for Home Assistant (graphs, nags): seconds, so HA can derive minutes.
  - platform: template
    name: Sitting seconds
    id: sitting_seconds
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(sit_s);
  - platform: template
    name: Away seconds
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(away_s);
  - platform: wifi_signal
    name: WiFi RSSI
    id: rssi
    update_interval: 10s

# Once a second: count while present; while away, hold the time, and clear it after 5 min away.
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(presence).state) {
            id(sit_s)++;
            id(away_s) = 0;
          } else if (id(away_s) < 300 && ++id(away_s) >= 300) {
            id(sit_s) = 0;
          }

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 14

display:
  - platform: tm1637
    id: seg
    clk_pin: GPIO14   # D5
    dio_pin: GPIO12   # D6
    intensity: 3
    update_interval: 1s
    lambda: |-
      // MM.SS: the dot after digit 2 is the colon on a clock-type TM1637
      it.printf("%02d.%02d", (id(sit_s) / 60) % 100, id(sit_s) % 60);

  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"   # an SH1106 needs model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.printf(0, 0, id(roboto), "SITTING %d:%02d", id(sit_s) / 60, id(sit_s) % 60);
      if (id(presence).state)
        it.printf(0, 22, id(roboto), "M%.0f/%.0f S%.0f/%.0f", id(mdist).state, id(menergy).state, id(sdist).state, id(senergy).state);
      else
        it.printf(0, 22, id(roboto), "AWAY");
      it.printf(0, 44, id(roboto), "WiFi %.0f dBm", id(rssi).state);
