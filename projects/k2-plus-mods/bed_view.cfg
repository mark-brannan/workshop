# Bed view: bring the bed up to the camera for a look, with clearance kept.
# Install: copy to /mnt/UDISK/printer_data/config/, add `[include bed_view.cfg]`
# to printer.cfg, restart Klipper. Run from Fluidd's macro panel or console.
#
#   BED_VIEW          bed to Z 20 (nozzle 20 mm above the plate)
#   BED_VIEW Z=40     any height; never below the floor
#
# Floor: 10 mm, raised to the last job's object height + 10 when that is known,
# so a part left on the bed never meets the nozzle. Refuses while a job runs
# or before Z is homed.

[gcode_macro BED_VIEW]
description: Raise the bed toward the camera, keeping 10 mm above the plate or the last part
gcode:
  {% set floor_gap = 10.0 %}
  {% set cpd = printer.virtual_sdcard.cur_print_data | default({}) %}
  {% set meta = cpd.metadata | default({}) %}
  {% set part_h = (meta.object_height or 0) | float %}
  {% set floor = [floor_gap, part_h + floor_gap] | max %}
  {% set want = params.Z | default(20) | float %}
  {% set z = [want, floor] | max %}
  {% if printer.print_stats.state in ["printing", "paused"] %}
    RESPOND TYPE=error MSG="BED_VIEW: a job is {printer.print_stats.state}; not moving"
  {% elif "z" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="BED_VIEW: Z not homed; not moving"
  {% else %}
    SAVE_GCODE_STATE NAME=bed_view
    G90
    G1 Z{z} F600
    RESTORE_GCODE_STATE NAME=bed_view
    RESPOND MSG="BED_VIEW: nozzle {z} mm above the plate (asked {want}, floor {floor})"
  {% endif %}
