# Chamber heat soak for ASA/ABS. Any other material: no-op (stock behaviour).
# START_PRINT calls CHAMBER_PREHEAT early and CHAMBER_SOAK once the bed is hot.
# The soak returns when chamber_temp >= target - 1 or when the cap expires.
# M141 above 40 C also holds the rear fan off (stock macro; checked 2026-11-16), so nothing here touches it.
# Rear vents: closed for heat-up and printing, open only to purge fumes afterwards.

[gcode_macro _CHAMBER_SOAK_VARS]
variable_default_target: 50      # degC when the slicer passes no CHAMBER_TEMP > 40; Creality's K2 Plus default for ABS and ASA
variable_max_target: 60          # chamber_heater max_temp is 80
variable_cap_min: 45             # stop waiting after this many minutes; 50 C took 39 min of heater time in a 12 C room, 2026-11-16
variable_step_s: 15              # poll interval, seconds
variable_done: 0
gcode:

[gcode_macro CHAMBER_PREHEAT]
description: Start the chamber heater for ASA/ABS; no-op otherwise
gcode:
  {% set v = printer['gcode_macro _CHAMBER_SOAK_VARS'] %}
  {% set mat = params.MATERIAL|default('')|string|upper %}
  {% set req = params.CHAMBER_TEMP|default(0)|float %}
  {% set target = [req if req > 40 else v.default_target|float, v.max_target|float]|min %}
  {% if mat[:3] in ['ASA', 'ABS'] %}
    {action_respond_info("Chamber preheat %s: target %sC" % (mat, target))}
    M141 S{target|int}
  {% endif %}

[gcode_macro CHAMBER_SOAK]
description: Wait for the chamber target on ASA/ABS, capped; no-op otherwise
gcode:
  {% set v = printer['gcode_macro _CHAMBER_SOAK_VARS'] %}
  {% set mat = params.MATERIAL|default('')|string|upper %}
  {% set req = params.CHAMBER_TEMP|default(0)|float %}
  {% set target = [req if req > 40 else v.default_target|float, v.max_target|float]|min %}
  {% if mat[:3] in ['ASA', 'ABS'] %}
    M141 S{target|int}
    {% if params.BED_TEMP %}
      M190 S{params.BED_TEMP}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_SOAK_VARS VARIABLE=done VALUE=0
    {action_respond_info("Chamber soak: waiting for %sC, cap %s min" % (target - 1, v.cap_min))}
    {% for i in range((v.cap_min * 60 / v.step_s)|int) %}
      _CHAMBER_SOAK_STEP TARGET={target - 1}
    {% endfor %}
    _CHAMBER_SOAK_REPORT TARGET={target - 1}
  {% endif %}

[gcode_macro _CHAMBER_SOAK_STEP]
# Rendered when it runs, so each step reads the live temperature.
gcode:
  {% set v = printer['gcode_macro _CHAMBER_SOAK_VARS'] %}
  {% set t = printer['temperature_sensor chamber_temp'].temperature|float %}
  {% if v.done|int == 0 %}
    {% if t >= params.TARGET|float %}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_SOAK_VARS VARIABLE=done VALUE=1
    {% else %}
      M117 Chamber {t|round(1)}/{params.TARGET}C
      G4 P{v.step_s * 1000}
    {% endif %}
  {% endif %}

[gcode_macro _CHAMBER_SOAK_REPORT]
gcode:
  {% set v = printer['gcode_macro _CHAMBER_SOAK_VARS'] %}
  {% set t = printer['temperature_sensor chamber_temp'].temperature|float %}
  {% if v.done|int == 1 %}
    {action_respond_info("Chamber soak: reached %.1fC" % t)}
  {% else %}
    {action_respond_info("Chamber soak: cap hit at %.1fC (wanted %sC), printing anyway" % (t, params.TARGET))}
  {% endif %}

# Heat hold: after an ABS/ASA job (bed target >= min_bed at END_PRINT), keep the bed and chamber
# hot for hold_min minutes so the next job starts warm. The off-timer skips while a job is printing.
# END_PRINT calls _HEAT_HOLD_SAVE first, before its TURN_OFF_HEATERS. The hold starts once the job has
# ended, after the file's own trailing M141 S0. HEAT_HOLD starts one by hand; HEAT_HOLD_OFF ends it.
[gcode_macro _HEAT_HOLD_VARS]
variable_min_bed: 90             # degC; PETG jobs run below this
variable_hold_min: 120           # user's choice, 2026-11-19
variable_bed: 0
variable_chamber: 0
gcode:

[gcode_macro _HEAT_HOLD_SAVE]
gcode:
  {% set v = printer['gcode_macro _HEAT_HOLD_VARS'] %}
  {% set bed = printer.heater_bed.target|float %}
  {% if bed >= v.min_bed|float %}
    SET_GCODE_VARIABLE MACRO=_HEAT_HOLD_VARS VARIABLE=bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=_HEAT_HOLD_VARS VARIABLE=chamber VALUE={printer['gcode_macro _CHAMBER_SOAK_VARS'].default_target}
    UPDATE_DELAYED_GCODE ID=_heat_hold_on DURATION=2
  {% endif %}

[delayed_gcode _heat_hold_on]
gcode:
  {% set v = printer['gcode_macro _HEAT_HOLD_VARS'] %}
  {% if printer.print_stats.state == 'printing' %}
    UPDATE_DELAYED_GCODE ID=_heat_hold_on DURATION=2
  {% else %}
    M140 S{v.bed}
    M141 S{v.chamber}
    UPDATE_DELAYED_GCODE ID=_heat_hold_off DURATION={v.hold_min * 60}
    {action_respond_info("Heat hold: bed %s, chamber %s for %s min; HEAT_HOLD_OFF ends it" % (v.bed, v.chamber, v.hold_min))}
  {% endif %}

[delayed_gcode _heat_hold_off]
gcode:
  {% if printer.print_stats.state != 'printing' %}
    M140 S0
    M141 S0
    {action_respond_info("Heat hold: time up, bed and chamber off")}
  {% endif %}

[gcode_macro HEAT_HOLD]
description: Hold bed and chamber hot now: HEAT_HOLD [BED=100] [CHAMBER=50] [MIN=120]
gcode:
  {% set v = printer['gcode_macro _HEAT_HOLD_VARS'] %}
  SET_GCODE_VARIABLE MACRO=_HEAT_HOLD_VARS VARIABLE=bed VALUE={params.BED|default(100)|float}
  SET_GCODE_VARIABLE MACRO=_HEAT_HOLD_VARS VARIABLE=chamber VALUE={params.CHAMBER|default(printer['gcode_macro _CHAMBER_SOAK_VARS'].default_target)|float}
  SET_GCODE_VARIABLE MACRO=_HEAT_HOLD_VARS VARIABLE=hold_min VALUE={params.MIN|default(v.hold_min)|int}
  UPDATE_DELAYED_GCODE ID=_heat_hold_on DURATION=1

[gcode_macro HEAT_HOLD_OFF]
description: End a heat hold now: bed and chamber off
gcode:
  UPDATE_DELAYED_GCODE ID=_heat_hold_on DURATION=0
  UPDATE_DELAYED_GCODE ID=_heat_hold_off DURATION=0
  M140 S0
  M141 S0
